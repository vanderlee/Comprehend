site_name: Comprehend
site_description: PHP parser combinators with ABNF authoring, immutable syntax trees and explicit effects
site_url: https://vanderlee.github.io/Comprehend/
repo_url: https://github.com/vanderlee/Comprehend
edit_uri: blob/master/docs/

theme:
  name: mkdocs
  color_mode: auto
  favicon: assets/images/icon.webp

extra_css:
  - assets/stylesheets/comprehend.css

plugins:
  - search

markdown_extensions:
  - tables
  - fenced_code
  - toc:
      permalink: true

strict: true
validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn

nav:
  - Home: index.md
  - Getting started:
      - Tutorial: tutorial.md
      - Parse application values: application-values.md
      - Laravel integration: laravel.md
      - FAQ: faq.md
  - Grammar authoring:
      - Grammar authoring: grammar-authoring.md
      - Immutable facade: facade.md
      - Builders and Rulesets: builder.md
      - ABNF authoring: abnf.md
      - Spacing and trivia: trivia.md
      - Separated lists: separated-lists.md
      - Delimiters and value selection: value-selection.md
  - Parsing:
      - Execution semantics: execution.md
      - Full-input and prefix parsing: consumption.md
      - Sources and spans: sources.md
      - Source-based recognition: source-matching.md
      - Reading and skipping runs: read-scanning.md
      - File input and limits: file-input.md
      - Diagnostics: diagnostics.md
      - Error recovery: recovery.md
  - Results and semantics:
      - Parse results: parse-results.md
      - Semantic values: semantic-values.md
      - Structured validation: validation.md
      - Concrete syntax trees: concrete-trees.md
      - Abstract syntax trees: ast.md
      - Lifecycle and effects: lifecycle.md
      - Serialization: serialization.md
  - Bundled extensions:
      - Overview and loading: extensions.md
      - Numbers: numbers.md
      - Extraction: extraction.md
      - Expressions: expressions.md
      - ASCII identifiers and keywords: ascii-identifiers.md
      - Specification grammars: libraries.md
      - Specification catalog: specifications.md
      - URI grammar: uri.md
  - Extending Comprehend:
      - Writing syntax extensions: syntax-extensions.md
      - Discovery and capability providers: extension-discovery.md
      - Custom parser contract: source-and-extension-contract.md
  - Reference:
      - Supported API: reference.md
  - Project:
      - Contributing: contribute.md
      - Performance: performance.md
      - Extraction profiling: extraction-profiling.md
      - Extraction comparison: extraction-comparison.md
      - Migrating to 2.0: breaking-release.md
      - Canonical runtime: canonical-runtime.md
