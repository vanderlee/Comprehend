name: Breaking release

on:
  push:
    tags:
      - '2.0.0'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/tests.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: Prepare changelog entry
        run: php tools/release-notes.php "$GITHUB_REF_NAME" --require-date > "$RUNNER_TEMP/release-notes.md"

      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release already exists; retaining the published release."
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag \
              --title "Comprehend $GITHUB_REF_NAME" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
