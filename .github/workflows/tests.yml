name: Tests

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.php == '8.6' }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.1'
            composer: 'v2'
          - php: '8.2'
            composer: 'v2'
          - php: '8.3'
            composer: 'v2'
          - php: '8.4'
            composer: 'v2'
          - php: '8.5'
            composer: 'v2'
          - php: '8.6'
            composer: 'v2'

    name: PHP ${{ matrix.php }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, json, mbstring
          tools: composer:${{ matrix.composer }}
          coverage: none

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Check platform requirements
        run: composer check-platform-reqs

      - name: Run tests
        run: make test

      - name: Verify canonical API and syntax
        run: php tools/check-canonical.php

      - name: Verify runtime without DOM
        run: php -n -d extension=mbstring tools/check-without-dom.php

      - name: Verify quick start
        run: php docs/examples/quick-start.php

      - name: Verify execution examples
        run: php docs/examples/execution.php

      - name: Verify authoring equivalence
        run: php docs/examples/authoring.php

      - name: Verify file source and limits
        run: php docs/examples/file-input.php

      - name: Verify benchmark harness
        run: php tools/benchmark.php --worker=text --mode=recognition --source=memory --iterations=1 --size=64

      - name: Verify ABNF equivalence
        run: php docs/examples/abnf.php

      - name: Verify breaking-release examples
        run: php docs/examples/release.php

      - name: Verify release notes
        run: php tools/release-notes.php 2.0.0

  phpstan:
    name: PHPStan (level 8)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: dom, json, mbstring
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: make install

      - name: Run static analysis
        run: make phpstan
