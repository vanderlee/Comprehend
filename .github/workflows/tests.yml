name: Tests

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.php == '8.6' }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            composer: 'v2'
          - php: '8.3'
            composer: 'v2'
          - php: '8.4'
            composer: 'v2'
          - php: '8.5'
            composer: 'v2'
          - php: '8.6'
            composer: 'v2'

    name: PHP ${{ matrix.php }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, json, mbstring
          tools: composer:${{ matrix.composer }}
          coverage: none

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Check platform requirements
        run: composer check-platform-reqs

      - name: Run tests
        run: vendor/bin/phpunit

      - name: Verify canonical API and syntax
        run: php tools/check-canonical.php

      - name: Verify execution examples
        run: php docs/examples/execution.php

      - name: Verify authoring equivalence
        run: php docs/examples/authoring.php

      - name: Verify file source and limits
        run: php docs/examples/file-input.php

      - name: Verify benchmark harness
        run: php tools/benchmark.php --worker=text --mode=recognition --source=memory --iterations=1 --size=64
